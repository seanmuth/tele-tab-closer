name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint (Firefox/Chrome manifest)
        run: npx --yes web-ext@10.8.0 lint --source-dir . --ignore-files tele-tab-closer.zip build.sh build.cmd
      - name: Build zip
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tele-tab-closer
          path: tele-tab-closer.zip
