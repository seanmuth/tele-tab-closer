name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${manifest_version}" >&2
            exit 1
          fi
      - name: Lint
        run: npx --yes web-ext@10.8.0 lint --source-dir . --ignore-files tele-tab-closer.zip build.sh build.cmd
      - name: Build zip
        run: ./build.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tele-tab-closer.zip --generate-notes --title "${GITHUB_REF_NAME}"
