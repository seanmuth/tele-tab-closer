name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${manifest_version}" >&2
            exit 1
          fi
      - name: Lint
        run: npx --yes web-ext@10.8.0 lint --self-hosted --source-dir . --ignore-files tele-tab-closer.zip build.sh build.cmd 'scripts/**'
      - name: Build zip
        run: ./build.sh
      # AMO signs each version once: if a run fails after this step, bump the version before retrying.
      - name: Sign for Firefox (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx --yes web-ext@10.8.0 sign --channel=unlisted \
            --timeout 900000 --approval-timeout 900000 \
            --source-dir . --ignore-files tele-tab-closer.zip build.sh build.cmd 'scripts/**'
          version="${GITHUB_REF_NAME#v}"
          signed="$(ls web-ext-artifacts/*.xpi)"
          [ "$(echo "$signed" | wc -l)" -eq 1 ] || { echo "expected exactly one signed xpi" >&2; exit 1; }
          mv "$signed" "tele-tab-closer-${version}.xpi"
      - name: Generate update manifest
        run: node scripts/make-update-manifest.mjs "tele-tab-closer-${GITHUB_REF_NAME#v}.xpi" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "tele-tab-closer-${GITHUB_REF_NAME#v}.xpi" updates.json tele-tab-closer.zip \
            --generate-notes --title "${GITHUB_REF_NAME}"
